name: build CFD image
# One dispatch builds one image and pushes it to this account's GitHub package registry.
on:
  workflow_dispatch:
    inputs:
      variant: {description: "apt (stage 1) or opt (x86-64-v3 source build, trial)", default: apt}
permissions: {contents: read, packages: write}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: { ref: reviewer-speedups }
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: .github/docker
          file: .github/docker/${{ inputs.variant == 'opt' && 'Dockerfile.opt' || 'Dockerfile' }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/stem-cfd:${{ inputs.variant }}-${{ github.sha }}
