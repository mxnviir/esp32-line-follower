name: dafoam_adjoint
run-name: "DAFoam drag gradient (${{ inputs.state_zip || 'own state A' }})"

# The DAFoam discrete adjoint (research/sidepod_opt/dafoam) on a GitHub runner, in DAFoam's Docker
# image. Either it builds state A itself with Part 2's OpenFOAM pipeline (about 1.5 h on 4 cores), or it
# starts from a converged case folder zipped as a release asset (state_zip). The result
# (dafoam_sens.npz: the surface points and dD/dXs) is uploaded as an artifact.
on:
  workflow_dispatch:
    inputs:
      state_zip: { default: "", description: "release asset with a converged case folder ('' = solve state A here)" }
      release: { default: "sidepod-jobs", description: "release holding state_zip" }
      primal_iters: { default: "300", description: "DAFoam SIMPLE iterations from state A" }
      gmres_tol: { default: "1e-6" }
      image: { default: "dafoam/opt-packages:v5.1.1" }

permissions:
  contents: read

env:
  PY_DEPS: numpy==2.4.6 scipy==1.17.1 pandas trimesh==5.2.0 scikit-image shapely rtree==1.4.1 mapbox-earcut manifold3d==3.5.4 fast_simplification==0.2.0 jax jaxlib matplotlib pymeshlab==2025.7.post1 numba cadquery-ocp
  OMPI_MCA_hwloc_base_use_hwthreads_as_cpus: "1"
  OMPI_MCA_rmaps_base_oversubscribe: "1"
  GH_TOKEN: ${{ github.token }}

jobs:
  adjoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install $PY_DEPS
      - run: docker pull ${{ inputs.image }}
      - name: Converged case from the release
        if: inputs.state_zip != ''
        run: |
          gh release download "${{ inputs.release }}" -R "${{ github.repository }}" -p "${{ inputs.state_zip }}" -D /tmp/dl
          mkdir -p /tmp/state && unzip -q /tmp/dl/${{ inputs.state_zip }} -d /tmp/state
          P=$(find /tmp/state -path '*/constant/polyMesh/points*' | head -1)
          echo "STATE_DIR=${P%/constant/polyMesh/*}" >> "$GITHUB_ENV"
      - name: State A (if needed) + DAFoam primal and adjoint
        working-directory: research/sidepod_opt
        env:
          DAFOAM_IMAGE: ${{ inputs.image }}
          DAF_GMRES_TOL: ${{ inputs.gmres_tol }}
        run: |
          dafoam/remote_run.sh /tmp/dafoam_out 4 ${{ inputs.primal_iters }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dafoam-gradient-${{ github.run_id }}
          path: |
            /tmp/dafoam_out
            research/sidepod_opt/gate/dafoam_case/log.*
          if-no-files-found: ignore
