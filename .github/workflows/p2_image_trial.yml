name: p2 image trial
# Same car, fixed 4-core split, inside the two prebuilt images (reviewer 2026-11-16).
# Pass for the machine-tuned image: repeats identical across CPUs, and faster than apt;
# its answer may differ from apt (different compiled maths), so it is a new method that
# must then pass the noise gate before use.
on:
  workflow_dispatch:
    inputs:
      ref: { default: "reviewer-speedups" }
      tag: { default: "7191025" }
      skin: { default: "3.93" }
permissions: { contents: read, packages: read }
env:
  OMPI_MCA_hwloc_base_use_hwthreads_as_cpus: "1"
  OMPI_MCA_rmaps_base_oversubscribe: "1"
  OMPI_ALLOW_RUN_AS_ROOT: "1"
  OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
jobs:
  car:
    name: ${{ matrix.img }} rep ${{ matrix.rep }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: ghcr.io/${{ github.repository_owner }}/stem-cfd:${{ matrix.img }}-${{ inputs.tag }}
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        img: [apt, opt]
        rep: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref }}" }
      - working-directory: part5-simulation
        run: |
          start=$(date +%s)
          python -W ignore run_car.py --out ../out/r --body-json '{}' --skin-mm ${{ inputs.skin }} --cfd --res medium --np 4 --cfd-iters 1000 --cfd-json '{"layer_overrides":{"nSurfaceLayers":0},"decompose":"hierarchical"}' 2>&1 | grep -E "partition sha|Traceback|Error" | head -5
          echo "IMG minutes $(( ($(date +%s) - start) / 60 ))"
          echo "IMG cpu $(grep -m1 'model name' /proc/cpuinfo | sed 's/.*: *//')"
          python -c "import json; c=json.load(open('../out/r/summary.json'))['cfd_initial']; print('IMG result T', repr(c['T_at_target_s']), 'D20', repr(c['D20_N']))"
