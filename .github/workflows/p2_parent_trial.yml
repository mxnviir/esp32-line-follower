name: p2 parent trial
# Parent-car start (tests only, user 2026-11-15). Parent P solved and kept; child C (a
# slightly different skin) solved cold, warm from P for 1000 it, and warm from P for 600 it.
# Pass to use: warm1000 = cold1000 within 0.01 ms. warm600 shows whether a warm start may
# also stop early (must equal cold1000 within 0.01 ms to count).
on:
  workflow_dispatch:
    inputs:
      ref: { default: "reviewer-speedups" }
      skin_p: { default: "3.93" }
      skin_c: { default: "3.97" }
permissions: { contents: read }
env:
  PY_DEPS: numpy==2.4.6 scipy==1.17.1 pandas trimesh==5.2.0 scikit-image shapely rtree==1.4.1 mapbox-earcut manifold3d==3.5.4 fast_simplification==0.2.0 jax jaxlib matplotlib pymeshlab==2025.7.post1
  OMPI_MCA_hwloc_base_use_hwthreads_as_cpus: "1"
  OMPI_MCA_rmaps_base_oversubscribe: "1"
  CFDJ0: '{"layer_overrides":{"nSurfaceLayers":0},"decompose":"hierarchical"}'
jobs:
  parent:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - timeout-minutes: 25
        run: |
          (for i in 1 2 3 4 5 6; do timeout 90 sudo apt-get update -q && break; done)
          sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0
          curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash
          sudo apt-get install -y -q openfoam2412-default
      - run: pip install $PY_DEPS
      - working-directory: part5-simulation
        run: |
          python -W ignore run_car.py --out ../out/p --body-json '{}' --skin-mm ${{ inputs.skin_p }} --cfd --res medium --np 4 --cfd-iters 1000 --keep-runs --cfd-json "$CFDJ0" 2>&1 | tail -2
          d=$(ls -td ../part2-simulation/cfd_case_template/runs/*/ | head -1); echo "parent run dir $d"
          tar czf ../parent.tgz -C "$d" .
      - uses: actions/upload-artifact@v4
        with: { name: parent-case, path: parent.tgz, retention-days: 3 }
  child:
    needs: parent
    name: child ${{ matrix.m.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        m:
          - { id: cold1000, warm: "0", it: 1000 }
          - { id: warm1000, warm: "1", it: 1000 }
          - { id: warm600, warm: "1", it: 600 }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - timeout-minutes: 25
        run: |
          (for i in 1 2 3 4 5 6; do timeout 90 sudo apt-get update -q && break; done)
          sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0
          curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash
          sudo apt-get install -y -q openfoam2412-default
      - run: pip install $PY_DEPS
      - uses: actions/download-artifact@v4
        with: { name: parent-case }
      - working-directory: part5-simulation
        run: |
          mkdir -p /tmp/parent && tar xzf ../parent.tgz -C /tmp/parent
          J="$CFDJ0"; if [ "${{ matrix.m.warm }}" = "1" ]; then J='{"layer_overrides":{"nSurfaceLayers":0},"decompose":"hierarchical","warm_from":"/tmp/parent"}'; fi
          start=$(date +%s)
          python -W ignore run_car.py --out ../out/c --body-json '{}' --skin-mm ${{ inputs.skin_c }} --cfd --res medium --np 4 --cfd-iters ${{ matrix.m.it }} --cfd-json "$J" 2>&1 | tail -2
          echo "PARENT minutes $(( ($(date +%s) - start) / 60 ))"
          python -c "import json; c=json.load(open('../out/c/summary.json'))['cfd_initial']; print('PARENT ${{ matrix.m.id }} T', repr(c['T_at_target_s']), 'D20', repr(c['D20_N']))"
