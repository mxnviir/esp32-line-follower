name: p2 trial
# Same car, several set-ups, N repeats each (reviewer 2026-11-15). variants: JSON list of
# {"id","np","cfd"(JSON string),"ompi"("0"/"1")}. Compare T and minutes per set-up.
on:
  workflow_dispatch:
    inputs:
      ref: { default: "reviewer-speedups" }
      skins: { default: '["3.93"]' }
      res: { default: "medium" }
      reps: { default: "[1,2]" }
      variants: { required: true }
      maxp: { default: "6" }
permissions: { contents: read }
env:
  PY_DEPS: numpy==2.4.6 scipy==1.17.1 pandas trimesh==5.2.0 scikit-image shapely rtree==1.4.1 mapbox-earcut manifold3d==3.5.4 fast_simplification==0.2.0 jax jaxlib matplotlib pymeshlab==2025.7.post1
  OMPI_MCA_hwloc_base_use_hwthreads_as_cpus: "1"
  OMPI_MCA_rmaps_base_oversubscribe: "1"
jobs:
  car:
    name: ${{ matrix.v.id }} skin ${{ matrix.skin }} rep ${{ matrix.rep }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.maxp) }}
      matrix:
        rep: ${{ fromJSON(inputs.reps) }}
        skin: ${{ fromJSON(inputs.skins) }}
        v: ${{ fromJSON(inputs.variants) }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - timeout-minutes: 25
        run: |
          (for i in 1 2 3 4 5 6; do timeout 90 sudo apt-get update -q && break; done)
          sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0
          curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash
          sudo apt-get install -y -q openfoam2412-default
      - run: pip install $PY_DEPS
      - working-directory: part5-simulation
        env:
          CFDJ: ${{ matrix.v.cfd }}
        run: |
          if [ "${{ matrix.v.ompi }}" = "1" ]; then
            export OMPI_MCA_coll_tuned_use_dynamic_rules=1 OMPI_MCA_coll_tuned_allreduce_algorithm=1 OMPI_MCA_coll_tuned_reduce_algorithm=1
          fi
          J=$(python -c "import json,os; d=json.loads(os.environ['CFDJ']); d['layer_overrides']={'nSurfaceLayers':0}; print(json.dumps(d))")
          start=$(date +%s)
          python -W ignore run_car.py --out ../out/r --body-json '{}' --skin-mm ${{ matrix.skin }} --cfd --res ${{ inputs.res }} --np ${{ matrix.v.np }} --cfd-iters 1000 --cfd-json "$J" 2>&1 | grep -E "partition sha|Traceback|Error" | head -5
          echo "FOURC minutes $(( ($(date +%s) - start) / 60 ))"
      - name: The numbers
        if: always()
        run: |
          echo "FOURC cpu $(lscpu | grep 'Model name' | sed 's/.*: *//') nproc $(nproc)"
          echo "FOURC body $(sha256sum out/r/body_half.stl | cut -c1-16)"
          python - <<'PY'
          import json
          c = json.load(open("out/r/summary.json"))["cfd_initial"]
          print("FOURC result D20", repr(c["D20_N"]), "T", repr(c["T_at_target_s"]), "converged", c["converged"])
          PY
