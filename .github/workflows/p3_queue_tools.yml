name: p3_queue_tools
run-name: "Part 3 queue tools: ${{ inputs.action }}"
# Small jobs that WRITE queue batches (nothing is timed here): the compass-map generator and the
# carving-loop tick. The batch comes back as artifact "batch"; the reviewer adds it with the admin key.
on:
  workflow_dispatch:
    inputs:
      action: { description: "map_base | map_modes | tick", required: true }
      start: { description: "start car JSON (map_*)", default: '{"name":"chain1","layout":{"W":120.3,"x_front":46.0,"d_halo":43.72},"edits":[]}' }
      ref: { description: "full SHA of the code the cars run on", required: true }
      case_url: { default: "" }
      case_sha: { default: "" }
      queue: { description: "queue base URL (tick reads results)", default: "http://139.185.60.30:8090" }
permissions: { contents: read }
jobs:
  tool:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          sudo apt-get update -q && sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0
          pip install numpy==2.4.6 scipy==1.17.1 pandas trimesh==5.2.0 scikit-image shapely rtree==1.4.1 mapbox-earcut manifold3d==3.5.4 fast_simplification==0.2.0 jax jaxlib matplotlib pymeshlab==2025.7.post1
      - name: run
        working-directory: part5-simulation
        env: { ADMIN_KEY: "${{ secrets.QUEUE_ADMIN_KEY }}" }
        run: |
          echo '${{ inputs.start }}' > /tmp/start.json
          case "${{ inputs.action }}" in
            map_base)  python -W ignore ../part3-simulation/checks/map_jobs.py base /tmp/start.json ${{ inputs.ref }} > ../batch.json ;;
            map_modes) python -W ignore ../part3-simulation/checks/map_jobs.py modes /tmp/start.json ${{ inputs.ref }} "${{ inputs.case_url }}" "${{ inputs.case_sha }}" > ../batch.json ;;
            tick)
              gh release download farm-state -p state.json -D /tmp -R ${{ github.repository }} 2>/dev/null || { echo "no farm state yet"; exit 1; }
              curl -sf -H "X-Admin-Key: $ADMIN_KEY" "${{ inputs.queue }}/api/results?stage=p5-loop" > /tmp/results.json
              curl -sf "${{ inputs.queue }}/fine-sigma.json" > /tmp/sigma.json
              python -W ignore farm.py tick /tmp/state.json /tmp/results.json ../batch.json --shape-sigma-file /tmp/sigma.json
              cp /tmp/state.json ../state.json ;;
            *) echo "unknown action"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: batch
          if-no-files-found: ignore
          path: |
            batch.json
            state.json
