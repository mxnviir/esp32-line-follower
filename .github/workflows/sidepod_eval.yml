name: sidepod_eval
run-name: "Sidepod: OpenFOAM ${{ inputs.res }} on ${{ inputs.batch }}"

# One batch of sidepod cars from research/sidepod_opt (campaign.py with the `actions` evaluator).
# Each matrix job times one group of car folders on both frozen states of the trial car and
# uploads its results; the campaign downloads them (ActionsEvaluator.collect).
on:
  workflow_dispatch:
    inputs:
      batch: { required: true, description: "path of the batch folder in the repo (jobs/<campaign>/<batch>)" }
      res: { default: "medium", description: "medium | fine | resolved" }
      refs_tag: { default: "", description: "release tag holding refcase-A.zip and refcase-B.zip of THIS car ('' = plain solves)" }
      mode: { default: "auto", description: "auto | morph | warm | plain" }
      iters: { default: "1000" }

permissions:
  contents: read

env:
  PY_DEPS: numpy==2.4.6 scipy==1.17.1 pandas trimesh==5.2.0 scikit-image shapely rtree==1.4.1 mapbox-earcut manifold3d==3.5.4 fast_simplification==0.2.0 jax jaxlib matplotlib pymeshlab==2025.7.post1
  OMPI_MCA_hwloc_base_use_hwthreads_as_cpus: "1"
  OMPI_MCA_rmaps_base_oversubscribe: "1"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      groups: ${{ steps.g.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        run: echo "groups=$(python3 -c "import json;n=len(json.load(open('${{ inputs.batch }}/batch.json'))['groups']);print(json.dumps(list(range(n))))")" >> "$GITHUB_OUTPUT"

  car:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: OpenFOAM v2412
        timeout-minutes: 45
        run: |
          ((for i in 1 2 3; do timeout 120 sudo apt-get update -q && break; sleep 20; done) || true)
          for i in 1 2 3 4; do sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0 && break; sleep 60; done
          for i in 1 2 3 4; do (curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash) && sudo apt-get install -y -q openfoam2412-default && break; sleep 60; done
      - run: pip install $PY_DEPS
      - name: Frozen states of the trial car
        if: inputs.refs_tag != ''
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p /tmp/refs
          for s in A B; do
            gh release download ${{ inputs.refs_tag }} -R ${{ github.repository }} -p "refcase-$s.zip" -D /tmp/dl
            mkdir -p /tmp/refs/$s && unzip -q /tmp/dl/refcase-$s.zip -d /tmp/refs/$s
          done
          echo '{"A": "/tmp/refs/A", "B": "/tmp/refs/B"}' > /tmp/refs.json
      - name: Solve
        working-directory: research/sidepod_opt
        run: |
          refs=""; [ -f /tmp/refs.json ] && refs="--refs /tmp/refs.json"
          python -W ignore eval_one.py "../../${{ inputs.batch }}" ${{ matrix.group }} ${{ inputs.res }} $refs \
            --mode ${{ inputs.mode }} --iters ${{ inputs.iters }} --np 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sidepod-results-${{ strategy.job-index }}
          path: ${{ inputs.batch }}/results
