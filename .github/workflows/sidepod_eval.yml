name: sidepod_eval
run-name: "Sidepod: OpenFOAM ${{ inputs.res }} on ${{ inputs.batch }}"

# One batch of sidepod cars from research/sidepod_opt (campaign.py with the `actions` evaluator).
# The batch comes in as a release asset (nothing is committed). Each matrix job times one group
# of car folders on ONE frozen state, so each state gets its own 6 h job limit, and uploads its
# results; the campaign downloads them (ActionsEvaluator.collect) and combines the states.
on:
  workflow_dispatch:
    inputs:
      batch: { required: true, description: "batch name: <batch>.zip is an asset of the release below" }
      release: { default: "sidepod-jobs", description: "release holding the batch zips (ActionsEvaluator uploads them)" }
      res: { default: "medium", description: "medium | fine | resolved" }
      refs_tag: { default: "", description: "release tag holding refcase-A.zip and refcase-B.zip of THIS car ('' = plain solves)" }
      mode: { default: "auto", description: "auto | morph | warm | plain" }
      iters: { default: "1000" }

permissions:
  contents: read

env:
  PY_DEPS: numpy==2.4.6 scipy==1.17.1 pandas trimesh==5.2.0 scikit-image shapely rtree==1.4.1 mapbox-earcut manifold3d==3.5.4 fast_simplification==0.2.0 jax jaxlib matplotlib pymeshlab==2025.7.post1
  OMPI_MCA_hwloc_base_use_hwthreads_as_cpus: "1"
  OMPI_MCA_rmaps_base_oversubscribe: "1"
  GH_TOKEN: ${{ github.token }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.g.outputs.matrix }}
    steps:
      - id: g
        run: |
          gh release download "${{ inputs.release }}" -R "${{ github.repository }}" -p "${{ inputs.batch }}.zip" -D /tmp/dl
          unzip -q /tmp/dl/${{ inputs.batch }}.zip -d /tmp/b
          echo "matrix=$(python3 -c "import json;print(json.dumps(json.load(open('/tmp/b/${{ inputs.batch }}/batch.json'))['matrix']))")" >> "$GITHUB_OUTPUT"

  car:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: OpenFOAM v2412
        timeout-minutes: 45
        run: |
          ((for i in 1 2 3; do timeout 120 sudo apt-get update -q && break; sleep 20; done) || true)
          for i in 1 2 3 4; do sudo apt-get install -y -q libopengl0 libglu1-mesa libegl1 libgl1 libgomp1 libxkbcommon0 && break; sleep 60; done
          for i in 1 2 3 4; do (curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash) && sudo apt-get install -y -q openfoam2412-default && break; sleep 60; done
      - run: pip install $PY_DEPS
      - name: Batch
        run: |
          gh release download "${{ inputs.release }}" -R "${{ github.repository }}" -p "${{ inputs.batch }}.zip" -D /tmp/dl
          mkdir -p /tmp/jobs && unzip -q /tmp/dl/${{ inputs.batch }}.zip -d /tmp/jobs
      - name: Frozen state ${{ matrix.state }} of the trial car
        if: inputs.refs_tag != '' && matrix.state != 'plain'
        run: |
          gh release download ${{ inputs.refs_tag }} -R ${{ github.repository }} -p "refcase-${{ matrix.state }}.zip" -D /tmp/dl
          mkdir -p /tmp/refs/${{ matrix.state }} && unzip -q /tmp/dl/refcase-${{ matrix.state }}.zip -d /tmp/refs/${{ matrix.state }}
          echo '{"${{ matrix.state }}": "/tmp/refs/${{ matrix.state }}"}' > /tmp/refs.json
      - name: Solve
        working-directory: research/sidepod_opt
        run: |
          refs=""; [ -f /tmp/refs.json ] && refs="--refs /tmp/refs.json"
          python -W ignore eval_one.py "/tmp/jobs/${{ inputs.batch }}" ${{ matrix.group }} ${{ inputs.res }} --state ${{ matrix.state }} $refs \
            --mode ${{ inputs.mode }} --iters ${{ inputs.iters }} --np 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sidepod-results-${{ inputs.batch }}-${{ matrix.group }}-${{ matrix.state }}
          path: /tmp/jobs/${{ inputs.batch }}/results
          if-no-files-found: ignore
